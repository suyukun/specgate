name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --version
      - run: node scripts/build.mjs
      - run: node test/smoke.mjs
      - run: node test/claims.mjs
